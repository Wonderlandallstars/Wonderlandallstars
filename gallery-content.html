<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Media Gallery | Enchanted Legacy Cheer</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: 'Montserrat', sans-serif;
  background: linear-gradient(135deg, #ff008c, #7b00ff, #00d4ff);
  min-height: 100vh;
  padding: 40px 20px;
  color: white;
}

.gallery-container {
  max-width: 1200px;
  margin: 0 auto;
}

.gallery-header {
  text-align: center;
  margin-bottom: 50px;
}

.gallery-header h1 {
  font-size: 48px;
  margin-bottom: 10px;
  text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
}

.gallery-header p {
  font-size: 18px;
  opacity: 0.9;
}

.logout-btn {
  display: inline-block;
  margin-top: 20px;
  padding: 10px 25px;
  background: white;
  color: #ff008c;
  border: none;
  border-radius: 20px;
  cursor: pointer;
  font-weight: 600;
  transition: transform 0.2s;
}

.logout-btn:hover {
  transform: scale(1.05);
}

.gallery-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
  gap: 20px;
  margin-bottom: 40px;
}

.gallery-item {
  background: white;
  border-radius: 15px;
  overflow: hidden;
  cursor: pointer;
  transition: transform 0.3s, box-shadow 0.3s;
  box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
}

.gallery-item:hover {
  transform: translateY(-10px);
  box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
}

.gallery-item img {
  width: 100%;
  height: 250px;
  object-fit: cover;
}

.gallery-item-caption {
  padding: 15px;
  color: black;
}

.gallery-item-caption h3 {
  margin-bottom: 5px;
  color: #ff008c;
}

.gallery-item-caption p {
  font-size: 14px;
  color: #666;
}

/* Modal Styles */
.modal {
  display: none;
  position: fixed;
  z-index: 1000;
  left: 0;
  top: 0;
  width: 100%;
  height: 100%;
  background-color: rgba(0, 0, 0, 0.8);
}

.modal-content {
  margin: auto;
  display: block;
  width: 90%;
  max-width: 800px;
  max-height: 90vh;
  object-fit: contain;
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
}

.close-modal {
  position: absolute;
  top: 20px;
  right: 40px;
  font-size: 40px;
  color: white;
  cursor: pointer;
  font-weight: bold;
}

.close-modal:hover {
  color: #ff008c;
}

@media (max-width: 768px) {
  .gallery-header h1 {
    font-size: 32px;
  }

  .gallery-grid {
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 15px;
  }

  .modal-content {
    width: 95%;
  }

  .close-modal {
    top: 10px;
    right: 20px;
    font-size: 30px;
  }
}
</style>
</head>

<body>

<div class="gallery-container">
  <div class="gallery-header">
    <h1>✨ Media Gallery</h1>
    <p>Enchanted Legacy Cheer - Family Memories</p>
    <button class="logout-btn" onclick="logout()">Logout</button>
  </div>

  <div class="gallery-grid">
    <!-- Add your photos here by duplicating this structure -->
    <!-- Example placeholder items -->
    <div class="gallery-item" onclick="openModal('https://via.placeholder.com/300x250?text=Photo+1')">
      <img src="https://via.placeholder.com/300x250?text=Photo+1" alt="Photo 1">
      <div class="gallery-item-caption">
        <h3>Photo Title</h3>
        <p>Add your photo description here</p>
      </div>
    </div>

    <div class="gallery-item" onclick="openModal('https://via.placeholder.com/300x250?text=Photo+2')">
      <img src="https://via.placeholder.com/300x250?text=Photo+2" alt="Photo 2">
      <div class="gallery-item-caption">
        <h3>Photo Title</h3>
        <p>Add your photo description here</p>
      </div>
    </div>

    <div class="gallery-item" onclick="openModal('https://via.placeholder.com/300x250?text=Photo+3')">
      <img src="https://via.placeholder.com/300x250?text=Photo+3" alt="Photo 3">
      <div class="gallery-item-caption">
        <h3>Photo Title</h3>
        <p>Add your photo description here</p>
      </div>
    </div>
  </div>
</div>

<!-- Modal for enlarged images -->
<div id="imageModal" class="modal" onclick="closeModal()">
  <span class="close-modal" onclick="closeModal()">&times;</span>
  <img class="modal-content" id="modalImage" src="">
</div>

<script>
function openModal(imageSrc) {
  const modal = document.getElementById("imageModal");
  const modalImage = document.getElementById("modalImage");
  modalImage.src = imageSrc;
  modal.style.display = "block";
}

function closeModal() {
  const modal = document.getElementById("imageModal");
  modal.style.display = "none";
}

function logout() {
  window.location.href = "gallery.html";
}

// Close modal when pressing Escape key
document.addEventListener("keydown", function(event) {
  if (event.key === "Escape") {
    closeModal();
  }
});
</script>

</body>
</html>
